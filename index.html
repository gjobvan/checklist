<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>중계 사전답사 체크리스트</title>
    
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        :root, #pdf-wrapper {
            --bg-color: #0b0d14;
            --card-bg: #1e2029;
            --card-border: rgba(255, 255, 255, 0.08);
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --text-muted: #64748b;
        }

        /* ---------------- 공통 및 배경 ---------------- */
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(99, 102, 241, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(236, 72, 153, 0.1) 0%, transparent 40%);
            background-attachment: fixed;
            color: var(--text-main);
            font-family: 'Pretendard Variable', Pretendard, -apple-system, sans-serif;
            margin: 0;
            padding: 40px 20px 80px; 
            min-height: 100vh;
            line-height: 1.4;
        }
        @supports (padding: env(safe-area-inset-top)) {
            body {
                padding: env(safe-area-inset-top, 40px) env(safe-area-inset-right, 20px) env(safe-area-inset-bottom, 80px) env(safe-area-inset-left, 20px);
                min-height: 100dvh;
            }
        }
        button, input, textarea {
            -webkit-appearance: none;
            appearance: none;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* ---------------- 헤더 ---------------- */
        .header { text-align: center; margin-bottom: 24px; }
        .header-main-row {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 14px; width: 100%;
        }
        .header-spacer, .progress-wrapper-right { flex: 1; }
        .header h1 {
            flex: 0 0 auto; font-size: 34px; font-weight: 800; margin: 0;
            display: inline-flex; align-items: center; justify-content: center;
            gap: 12px; white-space: nowrap;
        }
        .header-text {
            background: linear-gradient(135deg, #ffffff, #cbd5e1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header-emoji {
            font-size: 38px; filter: drop-shadow(0 0 10px rgba(255,255,255,0.3));
        }
        
        /* ---------------- 프로그램명 & 장소 배지 스타일 ---------------- */
        #info-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 6px;
        }

        .info-pill {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border-radius: 12px;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            box-sizing: border-box;
        }

        /* 1. 프로그램명 버튼 및 입력 후 표시 (부드러운 블루 톤) */
        #program-name-btn,
        .program-name-display {
            background: rgba(59, 130, 246, 0.12);
            border: 1px solid rgba(96, 165, 250, 0.35);
            color: #93c5fd;
            font-size: 15px;
            font-weight: 600;
            padding: 8px 18px;
            min-height: 40px;
        }
        #program-name-btn:hover,
        .program-name-display:hover {
            background: rgba(59, 130, 246, 0.22);
            border-color: #60a5fa;
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(59, 130, 246, 0.25);
            color: #ffffff;
        }

        /* 2. 장소 버튼 및 입력 후 표시 (부드러운 에메랄드 톤) */
        #location-name-btn,
        .location-name-display {
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(52, 211, 153, 0.35);
            color: #6ee7b7;
            font-size: 14.5px;
            font-weight: 600;
            padding: 7px 16px;
            min-height: 38px;
        }
        #location-name-btn:hover,
        .location-name-display:hover {
            background: rgba(16, 185, 129, 0.22);
            border-color: #34d399;
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(16, 185, 129, 0.25);
            color: #ffffff;
        }

        .info-pill .pill-emoji {
            font-size: 1.15em;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }

        /* ---------------- PDF / 이미지 캡처 전용 스타일 (텍스트 가림 완벽 해결) ---------------- */
        .pdf-export-mode .info-pill {
            display: inline-block !important;
            text-align: center !important;
            line-height: 22px !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
            box-shadow: none !important;
            transform: none !important;
            transition: none !important;
        }
        .pdf-export-mode .info-pill .pill-emoji {
            display: inline-block !important;
            margin-right: 8px !important;
            filter: none !important;
            vertical-align: middle !important;
        }
        .pdf-export-mode .info-pill span {
            display: inline-block !important;
            vertical-align: middle !important;
            background: transparent !important;
        }
        .pdf-export-mode .header-text {
            background: none !important;
            -webkit-text-fill-color: #f8fafc !important;
            color: #f8fafc !important;
        }
        .pdf-export-mode .program-name-display {
            background: #111927 !important;
            border: 1px solid #3b82f6 !important;
            color: #93c5fd !important;
        }
        .pdf-export-mode .program-name-display span {
            color: #93c5fd !important;
        }
        .pdf-export-mode .location-name-display {
            background: #0d1e1a !important;
            border: 1px solid #10b981 !important;
            color: #6ee7b7 !important;
        }
        .pdf-export-mode .location-name-display span {
            color: #6ee7b7 !important;
        }

        /* ---------------- 컨트롤 버튼 ---------------- */
        .controls {
            display: flex; justify-content: flex-end; gap: 12px; margin-bottom: 24px;
        }
        .btn-action {
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-main); padding: 10px 18px; border-radius: 10px;
            font-family: inherit; font-size: 14.5px; font-weight: 600;
            cursor: pointer; transition: all 0.2s; display: flex; align-items: center; gap: 8px;
        }
        .btn-action:hover { background: rgba(255, 255, 255, 0.1); }
        .btn-pdf { background: rgba(59, 130, 246, 0.15); color: #60a5fa; border-color: rgba(59, 130, 246, 0.3); }
        .btn-image { background: rgba(16, 185, 129, 0.15); color: #34d399; border-color: rgba(16, 185, 129, 0.3); }
        .btn-reset { background: rgba(239, 68, 68, 0.1); color: #f87171; border-color: rgba(239, 68, 68, 0.2); }

        /* ---------------- 레이아웃 및 카드 ---------------- */
        .grid { display: flex; flex-wrap: wrap; gap: 28px; }
        .card {
            flex: 1 1 320px; max-width: 100%;
            background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 24px;
            padding: 30px; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; flex-direction: column; position: relative; overflow: hidden;
        }
        .card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 5px;
            background: var(--card-theme); opacity: 0.8;
        }
        .card:hover {
            transform: translateY(-4px); border-color: var(--card-theme-hover);
            box-shadow: 0 16px 40px -8px rgba(0, 0, 0, 0.4), 0 0 24px var(--card-theme-bg);
        }
        .card-full { flex: 1 1 100%; }
        
        .card-header {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 24px; padding-bottom: 18px; border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }
        .card-header-left { display: flex; align-items: center; gap: 16px; }
        .card-icon {
            font-size: 26px; width: 56px; height: 56px; display: flex; align-items: center; justify-content: center;
            border-radius: 16px; background: var(--card-theme-bg); color: var(--card-theme); border: 1px solid var(--card-theme-border);
        }
        .card-title { font-size: 23px; font-weight: 700; margin: 0; }
        .btn-add-memo {
            background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-sub); padding: 6px 12px; border-radius: 6px;
            font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; font-family: inherit;
        }
        .btn-add-memo:hover { background: rgba(255, 255, 255, 0.12); color: #fff; }
        .card-body { display: flex; flex-direction: column; flex-grow: 1; }

        /* ---------------- 리스트 아이템 (체크박스 스타일 포함) ---------------- */
        .item-wrapper { display: flex; flex-direction: column; margin-bottom: 14px; }
        .item-wrapper:last-child { margin-bottom: 0; }
        
        .item-content { 
            flex: 1; 
            cursor: pointer; 
            transition: opacity 0.2s; 
            padding: 2px 0;
        }
        .item-content:hover .item-text::before {
            opacity: 1;
        }
        
        .item-text {
            font-size: 17.5px; font-weight: 600; color: var(--text-main); line-height: 1.35;
            display: flex; align-items: flex-start;
        }
        
        .item-title-text { transition: all 0.2s; }
        
        .item-text::before {
            content: ''; display: inline-flex; width: 14px; height: 14px;
            align-items: center; justify-content: center;
            background: transparent; border: 2px solid var(--card-theme);
            border-radius: 4px; margin-top: 5px; margin-right: 12px; flex-shrink: 0; opacity: 0.9;
            transition: all 0.2s;
        }
        
        .item-subtext {
            font-size: 15px; color: var(--text-sub); margin-top: 2px;
            display: block; padding-left: 30px; transition: all 0.2s;
        }
        .sub-list { margin: 4px 0 0 0; padding-left: 0; list-style: none; }
        .sub-list li {
            font-size: 15.5px; color: var(--text-sub); margin-bottom: 4px;
            position: relative; line-height: 1.4; padding-left: 14px; margin-left: 30px;
            transition: all 0.2s;
        }
        .sub-list li:last-child { margin-bottom: 0; }
        .sub-list li::before { content: '•'; position: absolute; left: 0; color: var(--text-muted); }

        .item-wrapper.checked .item-title-text,
        .item-wrapper.checked .item-subtext,
        .item-wrapper.checked .sub-list li {
            text-decoration: line-through;
            color: var(--text-muted);
        }
        
        .item-wrapper.checked .item-text::before {
            background: var(--card-theme);
            content: '✓';
            color: var(--card-bg);
            font-size: 11px;
            font-weight: 900;
        }

        .category-memo-display {
            margin-top: 18px; padding: 14px; background: rgba(255, 255, 255, 0.05);
            border-left: 3px solid var(--card-theme); border-radius: 8px; color: var(--text-main);
            font-size: 15px; line-height: 1.5; cursor: pointer; white-space: pre-wrap; transition: background 0.2s;
        }
        .category-memo-display:hover { background: rgba(255, 255, 255, 0.08); }

        /* ---------------- 공통 모달 ---------------- */
        #alert-modal { z-index: 1100; }
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px);
            display: flex; align-items: center; justify-content: center; z-index: 1000;
        }
        .modal-content {
            background: #1e2029; border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px; padding: 24px; width: 90%; max-width: 400px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        .modal-content.text-center { text-align: center; }
        .modal-content h3 { margin: 0 0 16px 0; font-size: 18px; color: #fff; }
        .modal-input {
            width: 100%; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.2);
            color: #fff; padding: 12px; border-radius: 8px; font-size: 16px;
            margin-bottom: 20px; font-family: inherit;
        }
        .modal-textarea { resize: vertical; min-height: 100px; line-height: 1.5; }
        .modal-input:focus { outline: none; border-color: #3b82f6; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 12px; }
        .modal-actions.center { justify-content: center; }
        .modal-btn {
            padding: 8px 16px; border-radius: 8px; font-size: 14px; font-weight: 600;
            cursor: pointer; border: none; transition: all 0.2s;
        }
        .btn-cancel { background: rgba(255,255,255,0.1); color: #ccc; }
        .btn-cancel:hover { background: rgba(255,255,255,0.2); }
        .btn-save { background: #3b82f6; color: #fff; }
        .btn-save:hover { background: #2563eb; }
        .btn-danger { background: #ef4444; color: #fff; }
        .btn-danger:hover { background: #dc2626; }

        /* ---------------- PDF Export용 특별 스타일 ---------------- */
        .pdf-export-mode .btn-add-memo { display: none !important; }
        .pdf-export-mode {
            background-image: 
                radial-gradient(circle at 0% 0%, rgba(99, 102, 241, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(236, 72, 153, 0.1) 0%, transparent 40%) !important;
            display: flex !important; flex-direction: column !important;
            align-items: center !important; padding: 40px 20px !important;
        }
        .pdf-export-mode .container { width: 100% !important; max-width: 1100px !important; margin: 0 !important; }

        /* ---------------- 미디어 쿼리 & 프린트 ---------------- */
        @media (max-width: 768px) {
            .grid { grid-template-columns: 1fr; }
            body { padding: 20px 16px 60px; }
            .header h1 { font-size: 28px; }
            .header-main-row { flex-direction: column; gap: 14px; }
            .header-spacer, .progress-wrapper-right { display: none; }
        }       
        @media print {
            body, #pdf-wrapper {
                background: #0b0d14 !important; color: #f8fafc !important;
                -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important;
            }
            #action-controls, .btn-add-memo, .modal-overlay { display: none !important; }
            .card { break-inside: avoid; page-break-inside: avoid; background: #1e2029 !important; }
        }
    
        /* 사진첨부 CSS */
        .photo-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 18px;
        }
        .photo-item {
            width: calc(33.333% - 6.666px);
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--card-border);
            border-radius: 6px;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .photo-item:hover {
            border-color: rgba(255, 255, 255, 0.3);
        }
        .photo-item-title {
            font-size: 14.5px;
            color: var(--text-main);
            text-align: center;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }
        .photo-item-img {
            width: 100%;
            aspect-ratio: 4/3;
            object-fit: cover;
            border-radius: 4px;
            background: #000;
        }
        .photo-item-memo {
            font-size: 13px;
            color: var(--text-sub);
            margin-top: 4px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #photo-detail-modal .modal-content {
            max-width: 800px;
            width: 95%;
        }
        #photo-detail-img {
            width: 100%;
            max-height: 75vh;
            object-fit: contain;
            margin: 15px 0;
            border-radius: 6px;
            background: #000;
        }
        .photo-memo-text {
            color: var(--text-sub);
            font-size: 14px;
            line-height: 1.5;
            background: rgba(0,0,0,0.2);
            padding: 10px;
            border-radius: 6px;
            white-space: pre-wrap;
        }

    </style>
</head>
<body>

<div class="container" style="padding-top: 10px;">
    <div class="controls" id="action-controls">
        <button class="btn-action btn-pdf" onclick="downloadPDF()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            <span id="text-pdf">PDF</span>
        </button>
        <button class="btn-action btn-image" onclick="downloadImage()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
            <span id="text-image">이미지</span>
        </button>
        <button class="btn-action btn-reset" onclick="openResetModal()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
            초기화
        </button>
    </div>
</div>

<div id="pdf-wrapper" style="background-color: #0b0d14; padding: 40px 20px 40px 20px;">    
    <div class="container">
        <div class="header">
            <div class="header-main-row">
                <div class="header-spacer"></div>
                <h1>
                    <span class="header-emoji">📋</span> 
                    <span class="header-text">중계 사전답사</span>
                </h1>
                <div class="progress-wrapper-right"></div>
            </div>
            <div id="info-container">
                <div id="program-name-container">
                    <button id="program-name-btn" class="info-pill" onclick="openProgramModal()"><span class="pill-emoji">📺</span>프로그램 제목을 입력해주세요</button>
                </div>
                <div id="location-name-container">
                    <button id="location-name-btn" class="info-pill" onclick="openLocationModal()"><span class="pill-emoji">📍</span>장소를 입력해 주세요</button>
                </div>
            </div>
        </div>
        <div class="grid" id="checklist-container"></div>
    </div>
</div>

<!-- 모달 공통 영역 -->
<div id="program-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
        <h3>프로그램명 입력</h3>
        <input type="text" id="modal-program-input" class="modal-input" placeholder="예: 2026 월드컵 중계">
        <div class="modal-actions">
            <button class="modal-btn btn-cancel" onclick="closeModal('program-modal')">취소</button>
            <button class="modal-btn btn-save" onclick="applyProgramName()">확인</button>
        </div>
    </div>
</div>

<div id="location-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
        <h3>장소 입력</h3>
        <input type="text" id="modal-location-input" class="modal-input" placeholder="예: 상암동 월드컵 경기장">
        <div class="modal-actions">
            <button class="modal-btn btn-cancel" onclick="closeModal('location-modal')">취소</button>
            <button class="modal-btn btn-save" onclick="applyLocationName()">확인</button>
        </div>
    </div>
</div>

<div id="memo-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
        <h3>메모</h3>
        <textarea id="modal-memo-input" class="modal-input modal-textarea" placeholder="메모를 입력하세요..."></textarea>
        <div class="modal-actions" style="justify-content: flex-end; gap: 12px;">
            <button class="modal-btn btn-danger" id="btn-delete-memo" onclick="deleteMemo()" style="display: none;">삭제</button>
            <button class="modal-btn btn-cancel" onclick="closeModal('memo-modal')">취소</button>
            <button class="modal-btn btn-save" onclick="applyMemo()">저장</button>
        </div>
    </div>
</div>

<div id="reset-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content text-center">
        <h3>초기화</h3>
        <p style="color: var(--text-sub); margin-bottom: 24px; font-size: 15px; line-height: 1.5;">작성된 모든 메모와 프로그램명, 장소, 체크 내역을<br>초기화 하시겠습니까?</p>
        <div class="modal-actions center">
            <button class="modal-btn btn-cancel" onclick="closeModal('reset-modal')">취소</button>
            <button class="modal-btn btn-danger" onclick="executeReset()">초기화</button>
        </div>
    </div>
</div>

<div id="alert-modal" class="modal-overlay" style="display: none;">
    <div class="modal-content text-center">
        <h3 id="alert-modal-title">알림</h3>
        <p id="alert-modal-message" style="color: var(--text-sub); margin-bottom: 24px; font-size: 15px; line-height: 1.5;"></p>
        <div class="modal-actions center" id="alert-modal-actions"></div>
    </div>
</div>

<!-- 사진 업로드 모달 -->
<div class="modal-overlay" id="photo-upload-modal" style="display: none;">
    <div class="modal-content">
        <h3 class="modal-title">사진 첨부</h3>
        <input type="text" class="modal-input" id="photo-title-input" placeholder="사진 제목을 입력하세요" />
        <input type="file" id="photo-file-input" accept="image/*" style="margin-top: 15px; color: var(--text-main); width: 100%;" />
        <textarea class="modal-input" id="photo-memo-input" placeholder="메모를 입력하세요 (선택사항)" rows="3" style="margin-top: 15px;"></textarea>
        <div class="modal-actions">
            <button class="modal-btn btn-cancel" onclick="closePhotoModal()">취소</button>
            <button class="modal-btn btn-save" id="btn-save-photo" onclick="savePhoto()">추가</button>
        </div>
    </div>
</div>

<!-- 사진 상세 모달 -->
<div class="modal-overlay" id="photo-detail-modal" style="display: none;">
    <div class="modal-content">
        <h3 class="modal-title" id="photo-detail-title">사진 상세</h3>
        <img id="photo-detail-img" src="" alt="Photo Detail" />
        <div class="photo-memo-text" id="photo-detail-memo"></div>
        <div class="modal-actions" style="justify-content: flex-end; gap: 12px; display: flex;">
            <button class="modal-btn btn-danger" id="btn-delete-photo">삭제</button>
            <div style="flex: 1;"></div>
            <button class="modal-btn btn-cancel" onclick="closePhotoDetail()">닫기</button>
            <button class="modal-btn btn-save" id="btn-edit-photo">수정</button>
        </div>
    </div>
</div>

<script>
    const checklistData = [
        {
            title: "중계차", icon: "🚐", theme: "#3b82f6",
            items: [
                { text: "진출입로", subItems: ["도로폭, 상단 장애물", "통과높이 : 4m 이상"] },
                { text: "주차위치", subItems: ["보도블럭, 연석 등 현장 훼손 가능성", "스커드, 후방 드럼룸 공간 확인"] },
                { text: "케이블 포설", subItems: ["포설 경로", "깔판 갯수"] }
            ]
        },
        {
            title: "영상", icon: "🎥", theme: "#8b5cf6",
            items: [
                { text: "배치도", subItems: ["출연자 수", "위치"] },
                { text: "카메라", subItems: ["STD / EFP / Drone / J·J / Rail", "대수 및 위치"] },
                { text: "각종 신호 In/Out" }
            ]
        },
        {
            title: "음향", icon: "🎧", theme: "#ec4899",
            items: [
                { text: "마이크", subItems: ["유·무선 / 핀·핸드", "Eff Mic 설치"] },               
                { text: "수음환경", subItems: ["공간 울림도", "소음 (바람, 에어컨 실외기 등)"] },
                { text: "페이징", subItems: ["유선 / 무선"] },
                { text: "인터컴", subItems: ["W/L-1, W/L-2, 인터컴 수량"] },
                { text: "확성", subItems: ["PGM / BGM / VCR"] }
            ]
        },
        {
            title: "조명", icon: "💡", theme: "#f59e0b",
            items: [
                { text: "태양광 방향" },
                { text: "전기", subItems: ["한전 : 배전함 위치, 허용용량", "발전차 : 주차공간 확보, 예산 협의, 섭외"] },
            ]
        },
        {
            title: "협조사항", icon: "🤝", theme: "#10b981",
            items: [
                { text: "연락처", subItems: ["현장 시설, 행사 담당자"] },
                { text: "주차", subItems: ["전날, 당일, 다음날"] },
                { text: "장비 설치" },
                { text: "장소 출입" }
            ]
        },
        {
            title: "회선구성", icon: "📡", theme: "#0ea5e9",
            items: [
                { text: "KT 회선", subItems: ["방송회선", "통신회선 (N-1, RD)"] },
                { text: "자체 회선", subItems: ["SNG", "MNG"] }
            ]
        },
        {
            title: "특이사항", icon: "📝", theme: "#64748b",
            isFullWidth: true,
            items: [] 
        },
        {
            title: "사진첨부", icon: "📸", theme: "#f43f5e",
            isFullWidth: true,
            isPhoto: true,
            items: [] 
        }
    ];

    let currentProgramName = ""; 
    let currentLocationName = ""; 
    let categoryMemos = []; 
    let categoryChecked = []; 
    let currentCategoryIndex = -1; 
    let currentSubMemoIndex = -1; 
    let categoryPhotos = [];
    let currentPhotoCategoryIndex = null;
    let currentDetailCategory = null;
    let currentDetailPhotoIndex = null;

    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    function openProgramModal() {
        document.getElementById('modal-program-input').value = currentProgramName;
        document.getElementById('program-modal').style.display = 'flex';
        document.getElementById('modal-program-input').focus();
    }
    
    function applyProgramName() {
        currentProgramName = document.getElementById('modal-program-input').value.trim();
        updateProgramDisplay();
        saveAndUpdate();
        closeModal('program-modal');
    }
    
    function updateProgramDisplay() {
        const container = document.getElementById('program-name-container');
        if (currentProgramName) {
            container.innerHTML = `<div class="info-pill program-name-display" onclick="openProgramModal()" title="클릭하여 프로그램명 수정"><span class="pill-emoji">📺</span><span>${currentProgramName}</span></div>`;
        } else {
            container.innerHTML = `<button id="program-name-btn" class="info-pill" onclick="openProgramModal()"><span class="pill-emoji">📺</span>프로그램 제목을 입력해주세요</button>`;
        }
    }

    function openLocationModal() {
        document.getElementById('modal-location-input').value = currentLocationName;
        document.getElementById('location-modal').style.display = 'flex';
        document.getElementById('modal-location-input').focus();
    }
    
    function applyLocationName() {
        currentLocationName = document.getElementById('modal-location-input').value.trim();
        updateLocationDisplay();
        saveAndUpdate();
        closeModal('location-modal');
    }

    function updateLocationDisplay() {
        const container = document.getElementById('location-name-container');
        if (currentLocationName) {
            container.innerHTML = `<div class="info-pill location-name-display" onclick="openLocationModal()" title="클릭하여 장소 수정"><span class="pill-emoji">📍</span><span>${currentLocationName}</span></div>`;
        } else {
            container.innerHTML = `<button id="location-name-btn" class="info-pill" onclick="openLocationModal()"><span class="pill-emoji">📍</span>장소를 입력해 주세요</button>`;
        }
    }

    function openMemoModal(categoryIdx, memoIdx = -1) {
        currentCategoryIndex = categoryIdx;
        currentSubMemoIndex = memoIdx;
        const modalInput = document.getElementById('modal-memo-input');
        const deleteBtn = document.getElementById('btn-delete-memo');
        
        modalInput.value = memoIdx >= 0 ? categoryMemos[categoryIdx][memoIdx] : "";
        deleteBtn.style.display = memoIdx >= 0 ? 'block' : 'none';

        document.getElementById('memo-modal').style.display = 'flex';
        modalInput.focus();
    }
    
    function applyMemo() {
        const text = document.getElementById('modal-memo-input').value.trim();
        if (currentCategoryIndex >= 0) {
            if (text) {
                if (currentSubMemoIndex >= 0) categoryMemos[currentCategoryIndex][currentSubMemoIndex] = text;
                else categoryMemos[currentCategoryIndex].push(text);
            } else if (currentSubMemoIndex >= 0) {
                categoryMemos[currentCategoryIndex].splice(currentSubMemoIndex, 1);
            }
            updateAllMemoDisplays();
            saveAndUpdate();
        }
        closeModal('memo-modal');
    }
    
    function deleteMemo() {
        if (currentCategoryIndex >= 0 && currentSubMemoIndex >= 0) {
            categoryMemos[currentCategoryIndex].splice(currentSubMemoIndex, 1);
            updateAllMemoDisplays();
            saveAndUpdate();
        }
        closeModal('memo-modal');
    }

    function updateAllMemoDisplays() {
        categoryMemos.forEach((memos, categoryIdx) => {
            const container = document.getElementById(`memo-container-${categoryIdx}`);
            if (container) {
                container.innerHTML = "";
                memos.forEach((memo, memoIdx) => {
                    if (memo) {
                        const div = document.createElement('div');
                        div.className = 'category-memo-display';
                        div.style.marginTop = '0';
                        div.style.display = 'block';
                        div.title = '클릭하여 메모 수정/삭제';
                        div.innerText = memo;
                        div.onclick = () => openMemoModal(categoryIdx, memoIdx);
                        container.appendChild(div);
                    }
                });
            }
        });
    }

    function toggleCheck(cIdx, iIdx) {
        categoryChecked[cIdx][iIdx] = !categoryChecked[cIdx][iIdx]; 
        const wrap = document.getElementById(`item-wrap-${cIdx}-${iIdx}`);
        
        if (categoryChecked[cIdx][iIdx]) {
            wrap.classList.add('checked');
        } else {
            wrap.classList.remove('checked');
        }
        
        saveAndUpdate();
    }

    function openResetModal() { document.getElementById('reset-modal').style.display = 'flex'; }
    
    function executeReset() {
        categoryMemos = new Array(checklistData.length).fill().map(() => []);
        categoryPhotos = new Array(checklistData.length).fill().map(() => []);
        categoryChecked = checklistData.map(c => new Array(c.items.length).fill(false)); 
        currentProgramName = "";
        currentLocationName = ""; 
        
        updateProgramDisplay();
        updateLocationDisplay();  
        updateAllMemoDisplays();
        updateAllPhotoDisplays();
        
        document.querySelectorAll('.item-wrapper.checked').forEach(el => el.classList.remove('checked'));
        
        saveAndUpdate();
        closeModal('reset-modal');
    }

    function openAlertModal(message, isPrintFallback = false, title = "안내") {
        document.getElementById('alert-modal-title').innerText = title;
        document.getElementById('alert-modal-message').innerHTML = message;
        
        const actions = document.getElementById('alert-modal-actions');
        actions.innerHTML = isPrintFallback 
            ? `<button class="modal-btn btn-cancel" onclick="closeModal('alert-modal')">취소</button><button class="modal-btn btn-save" onclick="executePrintFallback()">인쇄하기</button>`
            : `<button class="modal-btn btn-save" onclick="closeModal('alert-modal')">확인</button>`;
        
        document.getElementById('alert-modal').style.display = 'flex';
    }

    function executePrintFallback() {
        closeModal('alert-modal');
        window.print();
    }

    document.addEventListener('keydown', function(e) {
        const modals = ['program-modal', 'location-modal', 'memo-modal', 'reset-modal', 'alert-modal', 'photo-upload-modal', 'photo-detail-modal'];
        const openModalId = modals.find(id => document.getElementById(id).style.display === 'flex');

        if (e.key === 'Escape' && openModalId) {
            if (openModalId === 'photo-upload-modal') closePhotoModal();
            else if (openModalId === 'photo-detail-modal') closePhotoDetail();
            else closeModal(openModalId);
        }
        
        if (e.key === 'Enter' && openModalId && openModalId !== 'memo-modal' && openModalId !== 'photo-upload-modal') {
            e.preventDefault();
            if (openModalId === 'program-modal') applyProgramName();
            else if (openModalId === 'location-modal') applyLocationName();
            else if (openModalId === 'reset-modal') executeReset();
            else if (openModalId === 'alert-modal') {
                const actions = document.getElementById('alert-modal-actions').innerHTML;
                actions.includes('executePrintFallback()') ? executePrintFallback() : closeModal('alert-modal');
            }
        }
    });

    function hexToRgba(hex, alpha) {
        const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
        return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function renderChecklist() {
        categoryMemos = new Array(checklistData.length).fill().map(() => []);
        categoryChecked = checklistData.map(c => new Array(c.items.length).fill(false)); 
        
        const container = document.getElementById('checklist-container');
        
        checklistData.forEach((category, index) => {
            const card = document.createElement('div');
            card.className = category.isFullWidth ? 'card card-full' : 'card';
            
            card.style.setProperty('--card-theme', category.theme);
            card.style.setProperty('--card-theme-bg', hexToRgba(category.theme, 0.15));
            card.style.setProperty('--card-theme-border', hexToRgba(category.theme, 0.20));
            card.style.setProperty('--card-theme-hover', hexToRgba(category.theme, 0.40));

            const subItemsHTML = (item) => (item.subItems && item.subItems.length > 0) 
                ? `<ul class="sub-list">${item.subItems.map(sub => `<li>${sub}</li>`).join('')}</ul>` : '';
            
            const subTextHTML = (item) => item.subText 
                ? `<span class="item-subtext">${item.subText}</span>` : '';

            const itemsHTML = category.items.map((item, itemIdx) => `
                <div class="item-wrapper" id="item-wrap-${index}-${itemIdx}">
                    <div class="item-content" onclick="toggleCheck(${index}, ${itemIdx})">
                        <div class="item-text">
                            <span class="item-title-text">${item.text}</span>
                        </div>
                        ${subTextHTML(item)}
                        ${subItemsHTML(item)}
                    </div>
                </div>
            `).join('');

            card.innerHTML = `
                <div class="card-header">
                    <div class="card-header-left">
                        <div class="card-icon">${category.icon}</div>
                        <h2 class="card-title">${category.title}</h2>
                    </div>
                    <div class="card-header-right">
                        ${category.isPhoto 
                            ? `<button class="btn-add-memo" onclick="openPhotoModal(${index})">+ 사진</button>`
                            : `<button class="btn-add-memo" onclick="openMemoModal(${index})">+ 메모</button>`
                        }
                    </div>
                </div>
                <div class="card-body">
                    ${itemsHTML}
                    <div id="memo-container-${index}" style="margin-top: 18px; display: flex; flex-direction: column; gap: 8px;"></div>
                    ${category.isPhoto ? `<div id="photo-container-${index}" class="photo-grid"></div>` : ''}
                </div>
            `;
            container.appendChild(card);
        });

        loadState();
    }

    function saveAndUpdate() {
        try {
            localStorage.setItem('surveyChecklistStateV8', JSON.stringify({ 
                memos: categoryMemos, 
                photos: categoryPhotos, 
                programName: currentProgramName,
                locationName: currentLocationName, 
                checked: categoryChecked 
            }));
        } catch (error) {
            console.warn("데이터 자동 저장 제한:", error);
        }
    }

    function loadState() {
        let savedState = null;
        try {
            const rawData = localStorage.getItem('surveyChecklistStateV8');
            if (rawData) savedState = JSON.parse(rawData);
        } catch(error) {}
        
        if (savedState) {
            if (savedState.memos) categoryMemos = savedState.memos;
            if (savedState.photos) categoryPhotos = savedState.photos;
            if (savedState.programName) currentProgramName = savedState.programName;
            if (savedState.locationName) currentLocationName = savedState.locationName;
            if (savedState.checked) categoryChecked = savedState.checked;
        }

        // 최초 접속 시에도 2번 사진의 둥근 디자인(📺)으로 화면이 그려지도록 항상 호출
        updateProgramDisplay();
        updateLocationDisplay();

        while (categoryMemos.length < checklistData.length) categoryMemos.push([]);
        while (categoryPhotos.length < checklistData.length) categoryPhotos.push([]);
        while (categoryChecked.length < checklistData.length) categoryChecked.push([]);
        
        checklistData.forEach((category, cIdx) => {
            while (categoryChecked[cIdx].length < category.items.length) {
                categoryChecked[cIdx].push(false);
            }
            category.items.forEach((_, iIdx) => {
                const wrap = document.getElementById(`item-wrap-${cIdx}-${iIdx}`);
                if (wrap) {
                    if (categoryChecked[cIdx][iIdx]) wrap.classList.add('checked');
                    else wrap.classList.remove('checked');
                }
            });
        });
        
        updateAllMemoDisplays();
        updateAllPhotoDisplays();
        saveAndUpdate(); 
    }

    function updateAllPhotoDisplays() {
        checklistData.forEach((category, cIdx) => {
            if (category.isPhoto) {
                renderPhotos(cIdx);
            }
        });
    }

    function openPhotoModal(idx, pIdx = null) {
        currentPhotoCategoryIndex = idx;
        currentDetailPhotoIndex = pIdx;
        
        if (pIdx !== null) {
            const photo = categoryPhotos[idx][pIdx];
            document.getElementById('photo-title-input').value = photo.title || '';
            document.getElementById('photo-memo-input').value = photo.memo || '';
            document.getElementById('btn-save-photo').innerText = '수정';
        } else {
            document.getElementById('photo-title-input').value = '';
            document.getElementById('photo-file-input').value = '';
            document.getElementById('photo-memo-input').value = '';
            document.getElementById('btn-save-photo').innerText = '추가';
        }
        document.getElementById('photo-upload-modal').style.display = 'flex';
    }

    function closePhotoModal() {
        document.getElementById('photo-upload-modal').style.display = 'none';
        currentPhotoCategoryIndex = null;
        currentDetailPhotoIndex = null;
    }

    function savePhoto() {
        if (currentPhotoCategoryIndex === null) return;
        const title = document.getElementById('photo-title-input').value.trim();
        const fileInput = document.getElementById('photo-file-input');
        const memo = document.getElementById('photo-memo-input').value.trim();

        if (!title) {
            openAlertModal("사진 제목을 입력해주세요.");
            return;
        }
        
        const isEdit = (currentDetailPhotoIndex !== null);

        if (!isEdit && (!fileInput.files || fileInput.files.length === 0)) {
            openAlertModal("사진을 첨부해주세요.");
            return;
        }

        const finishSave = (dataUrl) => {
            if (isEdit) {
                categoryPhotos[currentPhotoCategoryIndex][currentDetailPhotoIndex] = { title, data: dataUrl, memo };
            } else {
                categoryPhotos[currentPhotoCategoryIndex].push({ title, data: dataUrl, memo });
            }
            saveAndUpdate();
            renderPhotos(currentPhotoCategoryIndex);
            closePhotoModal();
        };

        if (fileInput.files && fileInput.files.length > 0) {
            const file = fileInput.files[0];
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    const max_size = 800; 
                    if (width > height) {
                        if (width > max_size) {
                            height *= max_size / width;
                            width = max_size;
                        }
                    } else {
                        if (height > max_size) {
                            width *= max_size / height;
                            height = max_size;
                        }
                    }
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    finishSave(canvas.toDataURL('image/jpeg', 0.7));
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        } else {
            // 수정 시 사진 파일이 첨부되지 않았다면 기존 사진 유지
            finishSave(categoryPhotos[currentPhotoCategoryIndex][currentDetailPhotoIndex].data);
        }
    }

    function renderPhotos(cIdx) {
        const container = document.getElementById(`photo-container-${cIdx}`);
        if (!container) return;
        
        const photos = categoryPhotos[cIdx];
        if (!photos || photos.length === 0) {
            container.innerHTML = '';
            return;
        }

        container.innerHTML = photos.map((photo, pIdx) => `
            <div class="photo-item" onclick="openPhotoDetail(${cIdx}, ${pIdx})">
                <div class="photo-item-title">${photo.title}</div>
                <img src="${photo.data}" class="photo-item-img" alt="${photo.title}" />
                ${photo.memo ? `<div class="photo-item-memo">${photo.memo}</div>` : ''}
            </div>
        `).join('');
    }

    function openPhotoDetail(cIdx, pIdx) {
        currentDetailCategory = cIdx;
        currentDetailPhotoIndex = pIdx;
        const photo = categoryPhotos[cIdx][pIdx];
        
        document.getElementById('photo-detail-title').innerText = photo.title;
        document.getElementById('photo-detail-img').src = photo.data;
        const memoEl = document.getElementById('photo-detail-memo');
        if (photo.memo) {
            memoEl.style.display = 'block';
            memoEl.innerText = photo.memo;
        } else {
            memoEl.style.display = 'none';
        }

        const btnDelete = document.getElementById('btn-delete-photo');
        btnDelete.onclick = function() {
            deletePhoto(cIdx, pIdx);
        };

        const btnEdit = document.getElementById('btn-edit-photo');
        btnEdit.onclick = function() {
            closePhotoDetail();
            openPhotoModal(cIdx, pIdx);
        };

        document.getElementById('photo-detail-modal').style.display = 'flex';
    }

    function closePhotoDetail() {
        document.getElementById('photo-detail-modal').style.display = 'none';
        currentDetailCategory = null;
        currentDetailPhotoIndex = null;
    }

    function deletePhoto(cIdx, pIdx) {
        categoryPhotos[cIdx].splice(pIdx, 1);
        saveAndUpdate();
        renderPhotos(cIdx);
        closePhotoDetail();
    }

    /** 
     * ==========================================
     * 출력 (PDF / PNG) 공통 모듈
     * ==========================================
     */
    function toggleExportState(isExporting) {
        const element = document.getElementById('pdf-wrapper');
        const controls = document.getElementById('action-controls');
        const cards = document.querySelectorAll('.card');
        const pills = document.querySelectorAll('.info-pill');

        if (isExporting) {
            controls.style.display = 'none';
            cards.forEach(c => { c.style.backdropFilter = 'none'; c.style.webkitBackdropFilter = 'none'; });
            pills.forEach(p => { p.style.backdropFilter = 'none'; p.style.webkitBackdropFilter = 'none'; });
            element.classList.add('pdf-export-mode');
        } else {
            element.style.width = '';
            element.style.height = '';
            element.style.overflow = '';
            element.classList.remove('pdf-export-mode');
            cards.forEach(c => { c.style.backdropFilter = ''; c.style.webkitBackdropFilter = ''; });
            pills.forEach(p => { p.style.backdropFilter = ''; p.style.webkitBackdropFilter = ''; });
            controls.style.display = 'flex';
            document.querySelectorAll('iframe, .html2canvas-container').forEach(el => el.remove());
        }
        return element;
    }

    function downloadPDF() {
        const btnText = document.getElementById('text-pdf');
        const originalText = btnText.innerText;
        btnText.innerText = '⏳ 렌더링 중...';
        const element = toggleExportState(true);
        document.fonts.ready.then(() => {
            setTimeout(() => {
                const rect = element.getBoundingClientRect();
                element.style.width = rect.width + 'px';
                element.style.height = rect.height + 'px';
                element.style.overflow = 'hidden'; 

                const opt = {
                    margin: 0,
                    filename: currentProgramName ? `${currentProgramName}_사전답사.pdf` : '사전답사.pdf',
                    image: { type: 'jpeg', quality: 1 },
                    html2canvas: { scale: 2, backgroundColor: '#0b0d14', useCORS: true, scrollY: 0, scrollX: 0, width: rect.width, height: rect.height }, 
                    jsPDF: { unit: 'px', format: [rect.width, rect.height], orientation: rect.height > rect.width ? 'portrait' : 'landscape' }
                };

                html2pdf().from(element).set(opt).save()
                    .then(() => restore())
                    .catch(err => {
                        console.error("PDF 생성 에러:", err);
                        restore();
                        openAlertModal("기기 환경에 의해 PDF 자동 변환이 차단되었습니다.<br><br>아래 <b>[인쇄하기]</b> 버튼을 누른 후, 옵션에서 <b>'PDF로 저장'</b>을 선택해주세요.", true);
                    });
            }, 150);
        });

        function restore() { toggleExportState(false); btnText.innerText = originalText; }
    }

    function downloadImage() {
        const btnText = document.getElementById('text-image');
        const originalText = btnText.innerText;
        btnText.innerText = '⏳ 렌더링 중...';
        
        const element = toggleExportState(true);

        document.fonts.ready.then(() => {
            setTimeout(() => {
                const rect = element.getBoundingClientRect();
                element.style.width = rect.width + 'px';
                element.style.height = rect.height + 'px';
                element.style.overflow = 'hidden'; 

                html2canvas(element, { 
                    scale: 2, backgroundColor: '#0b0d14', useCORS: true, scrollY: 0, scrollX: 0, width: rect.width, height: rect.height
                }).then(canvas => {
                    const link = document.createElement('a');
                    link.href = canvas.toDataURL('image/png');
                    link.download = currentProgramName ? `${currentProgramName}_사전답사.png` : '사전답사.png';
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    restore();
                }).catch(err => {
                    console.error("이미지 생성 에러:", err);
                    restore();
                    openAlertModal("기기 환경에 의해 이미지 자동 변환이 차단되었습니다.", false);
                });
            }, 150);
        });

        function restore() { toggleExportState(false); btnText.innerText = originalText; }
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', renderChecklist);
    } else {
        renderChecklist();
    }
</script>
</body>
</html>
